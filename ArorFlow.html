<script>
/* Arorflow Admin Enrollment Office: CSV/XLS/XLSX bulk onboarding */
(function(){
  if(!window.P||!P.admin)return;
  NAV.admin.push(["enroll","Enroll Students","users"]);

  function norm(v){return String(v==null?"":v).trim()}
  function key(v){return norm(v).toLowerCase().replace(/[\s_-]+/g,"")}
  function rowsFromCSV(txt){
    var rows=[], row=[], cell="", q=false;
    for(var i=0;i<txt.length;i++){
      var ch=txt[i], nx=txt[i+1];
      if(ch==='"' && q && nx==='"'){cell+='"';i++;continue}
      if(ch==='"'){q=!q;continue}
      if(ch===',' && !q){row.push(cell);cell="";continue}
      if((ch==="\n"||ch==="\r")&&!q){
        if(ch==="\r"&&nx==="\n")i++;
        row.push(cell);cell="";
        if(row.some(function(x){return norm(x)!==""}))rows.push(row);
        row=[];continue;
      }
      cell+=ch;
    }
    row.push(cell);
    if(row.some(function(x){return norm(x)!==""}))rows.push(row);
    return rows;
  }
  function headerMap(h){
    var m={};
    h.forEach(function(v,i){
      var k=key(v);
      m[k]=i;
    });
    return m;
  }
  function val(r,m,names){
    for(var i=0;i<names.length;i++){var j=m[key(names[i])];if(j!==undefined)return norm(r[j])}
    return "";
  }
  function makeStudent(r,m,idx){
    var name=val(r,m,["name","full_name","fullname","student_name"]);
    var email=val(r,m,["email","email_address"]);
    var sid=val(r,m,["sid","student_id","studentid","roll_no","rollno","registration_no"]);
    var dept=val(r,m,["deptId","department","department_id","dept"]);
    var pid=val(r,m,["pid","program","program_id","programid"]);
    var sem=Number(val(r,m,["sem","semester"]))||1;
    var sec=val(r,m,["sec","section"])||"A";
    var phone=val(r,m,["phone","mobile","contact"]);
    var course=val(r,m,["course_code","coursecode","course"]);
    return {name:name,email:email,sid:sid,deptId:dept,pid:pid,sem:sem,sec:sec,phone:phone,course:course,_row:idx};
  }
  function resolveDept(x){
    if(!x)return DEMO.depts[0]&&DEMO.depts[0][0]||"d1";
    var d=DEMO.depts.find(function(d){return String(d[0]).toLowerCase()===x.toLowerCase()||String(d[1]).toLowerCase()===x.toLowerCase()});
    return d?d[0]:null;
  }
  function resolveProg(x){
    if(!x)return DEMO.progs[0]&&DEMO.progs[0][0]||"p1";
    var p=DEMO.progs.find(function(p){return String(p[0]).toLowerCase()===x.toLowerCase()||String(p[1]).toLowerCase()===x.toLowerCase()});
    return p?p[0]:null;
  }
  function resolveCourse(x){
    if(!x)return null;
    var c=D.courses().find(function(c){return c.id.toLowerCase()===x.toLowerCase()||c.code.toLowerCase()===x.toLowerCase()});
    return c||null;
  }
  function process(list){
    var users=D.users(), students=D.studs(), enr=D.enr(), created=0, updated=0, enrolled=0, errors=[];
    list.forEach(function(x){
      if(!x.name){errors.push("Row "+x._row+": name is required.");return}
      if(!x.email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.email)){errors.push("Row "+x._row+": valid email is required.");return}
      var dept=resolveDept(x.deptId), prog=resolveProg(x.pid);
      if(!dept){errors.push("Row "+x._row+": department '"+x.deptId+"' not found.");return}
      if(!prog){errors.push("Row "+x._row+": program '"+x.pid+"' not found.");return}
      if(x.sem<1||x.sem>8){errors.push("Row "+x._row+": semester must be 1-8.");return}
      var u=users.find(function(u){return u.email.toLowerCase()===x.email.toLowerCase()});
      if(u && u.role!=="student"){errors.push("Row "+x._row+": email already belongs to a non-student account.");return}
      var st=u?D.stBy(u.id):null;
      if(!u){
        var id=uid("u");
        u={id:id,name:x.name,email:x.email,role:"student",deptId:dept,phone:x.phone||"",status:"active"};
        users.push(u);
        st={uid:id,sid:x.sid||"AROR-"+new Date().getFullYear()+"-"+String(students.length+1).padStart(4,"0"),pid:prog,sem:x.sem,sec:x.sec};
        students.push(st); created++;
      }else{
        u.name=x.name;u.deptId=dept;u.phone=x.phone||u.phone||"";u.status=u.status||"active";
        if(!st){st={uid:u.id,sid:x.sid||"AROR-"+new Date().getFullYear()+"-"+String(students.length+1).padStart(4,"0"),pid:prog,sem:x.sem,sec:x.sec};students.push(st)}
        else{st.pid=prog;st.sem=x.sem;st.sec=x.sec;if(x.sid)st.sid=x.sid}
        updated++;
      }
      if(x.course){
        var c=resolveCourse(x.course);
        if(!c){errors.push("Row "+x._row+": course '"+x.course+"' not found.");return}
        var exists=enr.find(function(e){return e.sid===st.sid&&e.cid===c.id&&e.st!=="Dropped"});
        if(!exists){
          if(D.courses().find(function(z){return z.id===c.id}).en>=c.cap){errors.push("Row "+x._row+": "+c.code+" is full.");return}
          enr.push({id:uid("en"),sid:st.sid,cid:c.id,sec:c.sec||"A",sem:x.sem,st:"Approved",dt:today()});
          c.en=(c.en||0)+1;enrolled++;
        }
      }
    });
    W("users",users);W("students",students);W("enr",enr);W("courses",D.courses());
    return {created:created,updated:updated,enrolled:enrolled,errors:errors};
  }

  function readFile(file,done){
    var ext=(file.name.split(".").pop()||"").toLowerCase();
    var rd=new FileReader();
    rd.onerror=function(){done(null,"Could not read the selected file.")};
    rd.onload=function(){
      if(ext==="csv"||ext==="txt"||ext==="tsv"){
        var text=String(rd.result||"");
        if(ext==="tsv")text=text.replace(/\t/g,",");
        done(rowsFromCSV(text),null);return;
      }
      if(ext==="xlsx"||ext==="xls"){
        if(!window.XLSX){
          var sc=document.createElement("script");
          sc.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
          sc.onload=function(){
            try{
              var wb=XLSX.read(rd.result,{type:"array"});
              var ws=wb.Sheets[wb.SheetNames[0]];
              done(XLSX.utils.sheet_to_json(ws,{header:1,defval:""}),null);
            }catch(e){done(null,"Excel file could not be parsed.")}
          };
          sc.onerror=function(){done(null,"Excel support could not be loaded. Use CSV or allow internet access for the Excel parser.")};
          document.head.appendChild(sc);
        }else{
          try{
            var wb=XLSX.read(rd.result,{type:"array"});
            done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}),null);
          }catch(e){done(null,"Excel file could not be parsed.")}
        }
        return;
      }
      done(null,"Use a CSV, XLS or XLSX file.");
    };
    rd.readAsArrayBuffer(file);
  }

  P.admin.enroll=function(s,c,q){
    c.innerHTML=page("Enroll Students","Bulk onboarding from CSV or Excel. Existing student emails are updated instead of duplicated.",
      card("Upload student file",
        "<div class='al a-in' style='margin-bottom:12px'><b>Accepted columns:</b> name, email, sid, department/deptId, program/pid, semester/sem, section/sec, phone. Optional <b>course_code</b> enrolls the student into that course.</div>"+
        "<div class='row flexwrap'><input id='enfile' type='file' accept='.csv,.txt,.tsv,.xls,.xlsx'><button class='btn bp' id='enload'>Preview file</button><button class='btn bs' id='entpl'>Download CSV template</button></div>"+
        "<p class='small muted mt'>CSV works fully offline. XLS/XLSX uses the SheetJS browser parser when available.</p>")+
      card("Preview & import","<div id='enpreview'>"+empty("Select a file to preview.","","file")+"</div>"));
    document.getElementById("entpl").onclick=function(){
      var csv="name,email,sid,department,pid,semester,section,phone,course_code\nAli Khan,ali@example.com,AROR-2026-001,Architecture,p1,1,A,03001234567,ARCH-101\n";
      var b=new Blob([csv],{type:"text/csv"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="arorflow-student-template.csv";a.click();setTimeout(function(){URL.revokeObjectURL(u)},500)
    };
    document.getElementById("enload").onclick=function(){
      var f=document.getElementById("enfile").files[0];if(!f){toast("Choose a CSV or Excel file.","dg");return}
      readFile(f,function(raw,err){
        if(err){toast(err,"dg");return}
        if(!raw||raw.length<2){toast("No data rows found.","dg");return}
        var map=headerMap(raw[0]), list=raw.slice(1).map(function(r,i){return makeStudent(r,map,i+2)});
        var preview=list.slice(0,30);
        document.getElementById("enpreview").innerHTML="<p class='small muted'>"+list.length+" row(s) detected. Showing first "+preview.length+".</p>"+
          tbl(["Row","Name","Email","Student ID","Program","Semester","Course"],preview.map(function(x){return td(String(x._row))+td(esc(x.name))+td(esc(x.email))+td(esc(x.sid||"auto"))+td(esc(x.pid||"default"))+td(String(x.sem))+td(esc(x.course||"-"))}).join(""),900)+
          "<div class='row mt'><button class='btn bp' id='enimport'>Import & Enroll</button><span class='small muted'>Rows are validated before changes are committed.</span></div>";
        document.getElementById("enimport").onclick=function(){
          var r=process(list);
          var msg="Created "+r.created+", updated "+r.updated+", course enrollments "+r.enrolled+".";
          toast(msg,r.errors.length?"wn":"in");
          document.getElementById("enpreview").innerHTML="<div class='al "+(r.errors.length?"a-wn":"a-ok")+"'>"+esc(msg)+"</div>"+
            (r.errors.length?"<details style='margin-top:10px'><summary>"+r.errors.length+" row issue(s)</summary><ul>"+r.errors.slice(0,100).map(function(e){return "<li>"+esc(e)+"</li>"}).join("")+"</ul></details>":"")+
            "<button class='btn bs mt' id='enagain'>Upload another file</button>";
          document.getElementById("enagain").onclick=function(){location.hash="#/admin/enroll"};
        };
      });
    };
  };
})();
</script>

<script>
/* Personal profile, security and student challan office */
(function(){
  function userRec(s){return D.uById(s.id)||{}}
  function imgData(file,cb){
    if(!file){cb("");return}
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=700,w=im.width,h=im.height;
        if(w>max||h>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
        var cv=document.createElement("canvas");cv.width=w;cv.height=h;
        var x=cv.getContext("2d");x.drawImage(im,0,0,w,h);
        cb(cv.toDataURL("image/jpeg",.78));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  }
  function saveUserObj(u){
    var us=A("users"),i=us.findIndex(function(x){return x.id===u.id});
    if(i<0)return false;us[i]=u;return W("users",us);
  }

<script>
/* FINAL FUNCTIONALITY GUARD
   Every visible route gets a real working module. Existing modules are preserved;
   if an existing renderer fails at runtime, the route is replaced by a small
   local CRUD module instead of showing an error/placeholder message.
*/
(function(){
  function escF(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
  function readF(k){try{var v=store.read(k,null);return Array.isArray(v)?v:[]}catch(e){return[]}}
  function writeF(k,a){try{store.write(k,a);return true}catch(e){return false}}
  function uidF(){return 'rec-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
  function safeModule(role,id,s,c){
    var meta=(NAV[role]||[]).find(function(x){return x[0]===id})||[id,id,'set'];
    var title=meta[1]||id,spec=window.__ARORFLOW_FALLBACK_SPEC__(role,id,title),key='working_'+role+'_'+id,data=readF(key);
    function draw(){
      var rows=data.length?data.map(function(x){return '<tr>'+spec.fields.map(function(f){return '<td>'+escF(x[f.id])+'</td>'}).join('')+'<td><button class="btn bs sm" data-edit="'+escF(x.id)+'">Edit</button> <button class="btn bd sm" data-del="'+escF(x.id)+'">Delete</button></td></tr>';}).join(''):'<tr><td colspan="'+(spec.fields.length+1)+'"><div class="empty">No '+escF(spec.label.toLowerCase())+' records yet. Use Add '+escF(spec.label)+' to create the first record.</div></td></tr>';
      c.innerHTML='<div class="ph"><div><h1>'+escF(title)+'</h1><p class="muted">'+escF(spec.label)+' management</p></div></div><div class="card mb"><div class="ch"><h3 class="ct">Actions</h3></div><div class="cb"><button class="btn bp" id="wfAdd">Add '+escF(spec.label)+'</button> <button class="btn bs" id="wfRefresh">Refresh</button> <button class="btn bs" id="wfExport">Export CSV</button></div></div><div class="card"><div class="ch"><h3 class="ct">'+escF(spec.label)+' Records</h3></div><div class="cb"><div class="tablewrap"><table><thead><tr>'+spec.fields.map(function(f){return '<th>'+escF(f.label)+'</th>'}).join('')+'<th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div></div></div>';
      var add=document.getElementById('wfAdd');
      if(add)add.onclick=function(){formModal('Add '+spec.label,spec.fields,function(o,x){o.id=o.id||uidF();data.push(o);writeF(key,data);x.close();draw()})};
      var ref=document.getElementById('wfRefresh');if(ref)ref.onclick=function(){data=readF(key);draw()};
      var ex=document.getElementById('wfExport');if(ex)ex.onclick=function(){csv(key+'.csv',data)};
      qsa('[data-del]',c).forEach(function(b){b.onclick=function(){if(!confirm('Delete this record?'))return;data=data.filter(function(x){return String(x.id)!==String(b.dataset.del)});writeF(key,data);draw()}});

    }
    draw();
  }
  Object.keys(NAV||{}).forEach(function(role){
    P[role]=P[role]||{};
    (NAV[role]||[]).forEach(function(meta){
      var id=meta[0],orig=P[role][id];

  window.__ARORFLOW_ALL_ROUTES_GUARDED__=true;
})();

<script>
/* FINAL MODULE REPAIR: real admin workspaces for the SAP-parity modules.
   Each module has its own data fields, add/edit/status/delete actions,
   search, refresh and CSV export. */
(function(){
  function escM(v){return esc(v==null?'':String(v))}
  function arrM(k){var v=store.read(k,null);return Array.isArray(v)?v:[]}
  function putM(k,v){return store.write(k,v)}
  function addM(k,o){o.id=o.id||('adm_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6));var a=arrM(k);a.push(o);putM(k,a);return o}
  function modalM(title,fields,save){
    var body=fields.map(function(f){
      var type=f.type||'text', value=f.value!==undefined?String(f.value):'';
      if(type==='select'){
        return '<div class=\"fld\"><label>'+escM(f.label)+'</label><select id=\"mm_'+escM(f.id)+'\">'+(f.options||[]).map(function(o){return '<option value=\"'+escM(o[0])+'\"'+(String(o[0])===value?' selected':'')+'>'+escM(o[1])+'</option>'}).join('')+'</select></div>';
      }
      return '<div class=\"fld\"><label>'+escM(f.label)+'</label><input id=\"mm_'+escM(f.id)+'\" type=\"'+escM(type)+'\"'+(value?' value=\"'+escM(value)+'\"':'')+(f.placeholder?' placeholder=\"'+escM(f.placeholder)+'\"':'')+'></div>';
    }).join('');
    var launcher=(window.__ARORFLOW_FORCE_MODAL__||window.formModal);
    if(typeof launcher!=='function'){throw new Error('Add form engine is unavailable')}
    return launcher(title,fields,function(o,api){
      try{
        save(o);
        if(api&&typeof api.close==='function')api.close();
        toast(title+' saved','ok');
        render();
      }catch(e){
        console.error(e);
        toast('Could not save record: '+(e.message||e),'dg');
        return false;
      }
    });
  }
  function exportM(filename,storeKeys){var all=[];storeKeys.forEach(function(k){arrM(k).forEach(function(x){all.push(x)})});csv(filename,all)}
  function select(id,label,opts,value){return {id:id,label:label,type:'select',options:opts,value:value}}
  var statuses=[['Active','Active'],['Pending','Pending'],['Approved','Approved'],['Rejected','Rejected'],['Under Review','Under Review'],['Submitted','Submitted'],['Published','Published'],['Completed','Completed'],['Cancelled','Cancelled'],['Closed','Closed']];
  function grid(c,title,desc,config){
    var data=arrM(config.store), fields=config.fields;
    function draw(){
      data=arrM(config.store);
      var q=(document.getElementById('mxq')||{}).value||'';q=q.toLowerCase();
      var rows=data.filter(function(x){return !q||JSON.stringify(x).toLowerCase().indexOf(q)>-1});
      var body=rows.length?rows.map(function(x){return '<tr>'+fields.map(function(f){return '<td>'+escM(x[f.id])+'</td>'}).join('')+'<td><div class="row flexwrap"><button class="btn bs sm" data-mxedit="'+escM(x.id)+'">Edit</button><button class="btn bs sm" data-mxstatus="'+escM(x.id)+'">Status</button><button class="btn bd sm" data-mxdel="'+escM(x.id)+'">Delete</button></div></td></tr>'}).join(''):'<tr><td colspan="'+(fields.length+1)+'"><div class="empty">No '+escM(config.label.toLowerCase())+' records yet. Use Add '+escM(config.label)+' to create one.</div></td></tr>';
      c.innerHTML=ph(title,desc,'<div class="card mb"><div class="ch"><h3 class="ct">Actions</h3></div><div class="cb row flexwrap"><button class="btn bp" id="mxadd">Add '+escM(config.label)+'</button><input id="mxq" placeholder="Search '+escM(config.label.toLowerCase())+'..." style="min-width:220px"><button class="btn bs" id="mxref">Refresh</button><button class="btn bs" id="mxexp">Export CSV</button>'+(config.extra||'')+'</div></div><div class="card"><div class="ch"><h3 class="ct">'+escM(config.label)+' Records</h3><span class="small muted">'+rows.length+' record(s)</span></div><div class="cb"><div class="tablewrap"><table><thead><tr>'+fields.map(function(f){return '<th>'+escM(f.label)+'</th>'}).join('')+'<th>Actions</th></tr></thead><tbody>'+body+'</tbody></table></div></div></div>');
      var add=document.getElementById('mxadd');
      if(add)add.onclick=function(e){
        e.preventDefault();
        modalM('Add '+config.label,fields,function(o){
          var rec=addM(config.store,o);
          if(!rec)throw new Error('Storage write failed');
          toast(config.label+' added','ok');
        });
      };
      var ref=document.getElementById('mxref');if(ref)ref.onclick=draw;
      var qel=document.getElementById('mxq');if(qel){qel.value=q;qel.oninput=draw}
      var ex=document.getElementById('mxexp');if(ex)ex.onclick=function(){csv((config.store||title).replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.csv',arrM(config.store));toast('CSV exported')};
      qsa('[data-mxdel]',c).forEach(function(b){b.onclick=function(){if(!confirm('Delete this record?'))return;putM(config.store,arrM(config.store).filter(function(x){return String(x.id)!==String(b.dataset.mxdel)}));draw()}});
      qsa('[data-mxedit]',c).forEach(function(b){b.onclick=function(){var row=arrM(config.store).find(function(x){return String(x.id)===String(b.dataset.mxedit)});if(!row)return;modalM('Edit '+config.label,fields,function(o){o.id=row.id;putM(config.store,arrM(config.store).map(function(x){return String(x.id)===String(row.id)?o:x}))})}});

    }

  }

  function bind(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn}
  function statusAll(store,status){var a=arrM(store);a.forEach(function(x){x.status=status});putM(store,a);render()}
  var oldRender=render;
  /* Attach actions after each render for the current module. */
  function attach(){
    bind('regApprove',function(){statusAll('registrationsAdmin','Approved')});

    bind('examPublish',function(){statusAll('examsAdmin','Published')});

  /* Route render is already centralized; wrap it once so module-specific actions bind after navigation. */
  if(!window.__ARORFLOW_FINAL_RENDER_WRAP__){
    window.__ARORFLOW_FINAL_RENDER_WRAP__=true;
    var rr=window.render;
    window.render=function(){var z=rr.apply(this,arguments);setTimeout(attach,0);return z};
  }
})();
